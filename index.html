<!doctype html>
<!--
  JWC Desk call bounce page.
  Gmail add-ons can only open http(s) links, so JWC Desk opens
  https://mo-fritz.github.io/jwc-call/#<number> and this page hands the
  number to the computer's phone app (ConnectUC) as a tel: link.
  The number is after the #, so it never leaves the browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>JWC Call</title>
<style>
  :root { --ink: #111111; --gold: #C9A84C; --muted: #777777; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f2; --muted: #a0a0a0; --bg: #111111; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; }
  a { color: var(--gold); font-size: 28px; font-weight: 600; text-decoration: none; }
  p { color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <a id="call" href="#">Calling…</a>
  <p id="note">Opening your phone app.</p>
</main>
<script>
  (function () {
    var n = decodeURIComponent(location.hash.slice(1)).replace(/[^\d+]/g, '');
    var link = document.getElementById('call');
    var note = document.getElementById('note');
    if (!n) { link.textContent = 'No number'; note.textContent = 'Open a call from JWC Desk.'; return; }
    var tel = 'tel:' + n;
    link.href = tel;
    link.textContent = 'Call ' + n;
    location.href = tel;
    // First call in this browser: Chrome asks "Open ConnectUC?", so the tab must
    // stay open until that's answered. Once "Always allow" is ticked there's no
    // prompt, so later calls can close the tab on their own.
    var seen = false;
    try { seen = localStorage.getItem('jwcCallSeen') === '1'; localStorage.setItem('jwcCallSeen', '1'); } catch (e) {}
    if (!seen) {
      note.innerHTML = 'First call from this browser: tick <b>Always allow</b>, then click ' +
        '<b>Open ConnectUC</b>.<br>After that, calls go straight through and this tab closes itself.';
      return;
    }
    setTimeout(function () {
      note.textContent = 'Didn’t open? Click the number above. You can close this tab.';
      window.close();
    }, 3000);
  })();
</script>
</body>
</html>
